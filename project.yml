name: NetworkInspector
options:
  bundleIdPrefix: com.omarkar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  NetworkInspectorKit:
    path: NetworkInspectorKit

settingGroups:
  shared:
    CODE_SIGN_STYLE: Automatic
    # Set via the DEVELOPMENT_TEAM env var before running `xcodegen generate`,
    # so a personal team ID is never committed. Simulator builds (including CI)
    # do not sign, so an empty value here is harmless there.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NetworkInspector:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NetworkInspector
    dependencies:
      - package: NetworkInspectorKit
      # Content filter extensions that cut selected apps off from the network.
      - target: NetworkInspectorFilterData
      - target: NetworkInspectorFilterControl
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarkar.networkinspector
        CODE_SIGN_ENTITLEMENTS: NetworkInspector/NetworkInspector.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Network Inspector

  NetworkInspectorFilterData:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NetworkInspectorFilterData
    dependencies:
      - package: NetworkInspectorKit
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarkar.networkinspector.filter-data
        CODE_SIGN_ENTITLEMENTS: NetworkInspectorFilterData/NetworkInspectorFilterData.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: NetworkInspectorFilterData/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Network Inspector Filter

  NetworkInspectorFilterControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NetworkInspectorFilterControl
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarkar.networkinspector.filter-control
        CODE_SIGN_ENTITLEMENTS: NetworkInspectorFilterControl/NetworkInspectorFilterControl.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: NetworkInspectorFilterControl/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Network Inspector Filter Control

schemes:
  NetworkInspector:
    build:
      targets:
        NetworkInspector: all
    run:
      config: Debug
    test:
      config: Debug
